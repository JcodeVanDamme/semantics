<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test</title>
</head>
<body>
<p id="responseParagraph"></p>
<input type="text" id="input">
<button id="btt">GET</button>

<script>
    document.querySelector("#btt").addEventListener("click", async function () {
        const btt = document.querySelector("#btt")
        const input = document.querySelector("#input")
        const p = document.querySelector("#responseParagraph")
        try {
            const response = await fetch("/api?param=" + input.value)
            const data = await response.json()
            p.textContent = data.msg
        } catch (err) {
            p.textContent = "Error"
        }
    });
</script>

</body>
</html>
